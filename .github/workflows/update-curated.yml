name: Update Curated Restaurants

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-curated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run curated list updater
        run: node scripts/update-curated.mjs

      - name: Commit and push if updated
        run: |
          git config user.name "gilmat-bot"
          git config user.email "gilmat-bot@users.noreply.github.com"
          git add public/curated-places.json functions/api/route-search.js
          if git diff --cached --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "chore: 유명맛집 리스트 자동 업데이트"
            git push
          fi
